name: Publish Arena Companion

on:
  push:
    branches:
      - main
    paths:
      - "VERSION"
      - "RELEASE_NOTES.md"
      - "release_payload/current_parts/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build update ZIP
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="$VERSION"
          PAYLOAD_DIR="dist/TG_BTC_Arena_Companion_v${VERSION}"
          ZIP="TG_BTC_Arena_Companion_v${VERSION}.zip"

          mkdir -p "$PAYLOAD_DIR"
          cat release_payload/current_parts/part*.txt > "$PAYLOAD_DIR/tg_arena_bot.py"

          python -m py_compile "$PAYLOAD_DIR/tg_arena_bot.py"
          grep -F "APP_VERSION = \"${VERSION}\"" "$PAYLOAD_DIR/tg_arena_bot.py"

          (
            cd dist
            zip -qr "../$ZIP" "TG_BTC_Arena_Companion_v${VERSION}"
          )

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="$(cat RELEASE_NOTES.md)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --title "TG:BTC Arena Companion $VERSION" --notes "$NOTES"
          else
            gh release create "$TAG" "$ZIP" \
              --title "TG:BTC Arena Companion $VERSION" \
              --notes "$NOTES" \
              --target main
          fi
