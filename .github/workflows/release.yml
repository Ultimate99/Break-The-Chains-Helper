name: Publish Arena Companion

on:
  push:
    branches:
      - main
    paths:
      - "VERSION"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and validate full-source update ZIP
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="$VERSION"
          PAYLOAD_DIR="dist/TG_BTC_Arena_Companion_v${VERSION}"
          ZIP="TG_BTC_Arena_Companion_v${VERSION}.zip"

          mkdir -p "$PAYLOAD_DIR"
          python release_payload/build_release.py \
            --repo-root . \
            --version "$VERSION" \
            --output "$PAYLOAD_DIR/tg_arena_bot.py"

          python -m py_compile "$PAYLOAD_DIR/tg_arena_bot.py"
          grep -F "APP_VERSION = \"${VERSION}\"" "$PAYLOAD_DIR/tg_arena_bot.py"

          # While 7.1.2 remains public, use its workflow run as a hidden
          # compile/anchor test of the pending 7.2.0 patch against the exact
          # checksum-verified full source. Nothing from this test is published.
          if [ "$VERSION" = "7.1.2" ]; then
            python release_payload/build_release.py \
              --repo-root . \
              --version "7.2.0" \
              --output "/tmp/tg_arena_bot_v7_2_0.py"
            python -m py_compile "/tmp/tg_arena_bot_v7_2_0.py"
            grep -F 'APP_VERSION = "7.2.0"' "/tmp/tg_arena_bot_v7_2_0.py"
            grep -F 'V7.2 Vision-First Assistant build marker' "/tmp/tg_arena_bot_v7_2_0.py"
          fi

          (
            cd dist
            zip -qr "../$ZIP" "TG_BTC_Arena_Companion_v${VERSION}"
          )

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Record validation receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          version = os.environ["VERSION"]
          source = Path(f"dist/TG_BTC_Arena_Companion_v{version}/tg_arena_bot.py")
          record = {
              "version": version,
              "source_sha256": hashlib.sha256(source.read_bytes()).hexdigest(),
              "source_bytes": source.stat().st_size,
              "validated_at": datetime.now(timezone.utc).isoformat(),
              "full_source_build": True,
              "v7_2_0_hidden_validation": False,
          }
          pending = Path("/tmp/tg_arena_bot_v7_2_0.py")
          if pending.exists():
              record["v7_2_0_hidden_validation"] = True
              record["v7_2_0_sha256"] = hashlib.sha256(pending.read_bytes()).hexdigest()
              record["v7_2_0_bytes"] = pending.stat().st_size
          Path("release_payload/LAST_BUILD.json").write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release_payload/LAST_BUILD.json
          if ! git diff --cached --quiet; then
            git commit -m "Record validated build v${VERSION} [skip ci]"
            git push
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TG_BTC_Arena_Companion_v${{ env.VERSION }}
          path: ${{ env.ZIP }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE="RELEASE_NOTES.md"
          VERSION_NOTES="release_payload/release_notes/v${VERSION}.md"
          if [ -f "$VERSION_NOTES" ]; then
            NOTES_FILE="$VERSION_NOTES"
          fi
          NOTES="$(cat "$NOTES_FILE")"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --title "TG:BTC Game Assistant $VERSION" --notes "$NOTES"
          else
            gh release create "$TAG" "$ZIP" \
              --title "TG:BTC Game Assistant $VERSION" \
              --notes "$NOTES" \
              --target main
          fi
