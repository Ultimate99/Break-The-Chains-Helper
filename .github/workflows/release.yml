name: Publish Arena Companion

on:
  push:
    branches:
      - main
    paths:
      - "VERSION"
      - "RELEASE_NOTES.md"
      - "release_payload/full_source_parts/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build full-source update ZIP
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="$VERSION"
          PAYLOAD_DIR="dist/TG_BTC_Arena_Companion_v${VERSION}"
          ZIP="TG_BTC_Arena_Companion_v${VERSION}.zip"

          mkdir -p "$PAYLOAD_DIR"

          python - <<'PY'
          import base64
          import bz2
          from pathlib import Path

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          parts = sorted(Path("release_payload/full_source_parts").glob("part*.txt"))
          if not parts:
              raise SystemExit("No full-source payload parts found")

          encoded = "".join(p.read_text(encoding="utf-8").strip() for p in parts)
          raw = bz2.decompress(base64.b64decode(encoded))

          out = Path("dist") / f"TG_BTC_Arena_Companion_v{version}" / "tg_arena_bot.py"
          out.write_bytes(raw)
          print(f"Reconstructed {out} from {len(parts)} parts ({len(raw)} bytes)")
          PY

          python -m py_compile "$PAYLOAD_DIR/tg_arena_bot.py"
          grep -F "APP_VERSION = \"${VERSION}\"" "$PAYLOAD_DIR/tg_arena_bot.py"

          (
            cd dist
            zip -qr "../$ZIP" "TG_BTC_Arena_Companion_v${VERSION}"
          )

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="$(cat RELEASE_NOTES.md)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --title "TG:BTC Game Assistant $VERSION" --notes "$NOTES"
          else
            gh release create "$TAG" "$ZIP" \
              --title "TG:BTC Game Assistant $VERSION" \
              --notes "$NOTES" \
              --target main
          fi
