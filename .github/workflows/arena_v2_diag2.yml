name: Arena V2 Diagnostic 2

on:
  push:
    branches: [arena-v2]
    paths: [".github/workflows/arena_v2_diag2.yml"]

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena-v2
      - name: Build and persist result
        shell: bash
        env:
          TG_SKIP_MANIFEST_PUBLISH: "1"
        run: |
          set +e
          python release_payload/build_release_v730.py --repo-root . --version 7.3.0 --output /tmp/v730.py > /tmp/diag.log 2>&1
          RC=$?
          if [ "$RC" -eq 0 ]; then
            python -m py_compile /tmp/v730.py >> /tmp/diag.log 2>&1
            RC=$?
          fi
          cp /tmp/diag.log release_payload/ARENA_V2_VALIDATION_LOG.txt
          if [ "$RC" -eq 0 ]; then
            python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('/tmp/v730.py'); raw=p.read_bytes(); text=raw.decode()
          checks={
            'pilot_marker':'V7.3 Arena V2 Pilot — calibrated-action reinforcement controller build marker' in text,
            'pilot_gate':'"min_trained_matches": 6' in text and '"min_actions": 2' in text,
            'calibrated_only':'for name, point in (strat.get("action_points") or {}).items()' in text,
            'preempts_auto':text.index('if self._pilot_step(ref, adaptive_loss, actual_w, actual_h):') < text.index('if auto_state == "OFF":'),
            'adaptive_quit':'arena_adaptive_quit_ready()' in text,
            'phase1':'adaptive_loss = self._learning_sample(ref, auto_state)' in text,
          }
          if not all(checks.values()): raise SystemExit(checks)
          Path('release_payload/ARENA_V2_VALIDATION.json').write_text(json.dumps({'version':'7.3.0-dev-pilot','source_sha256':hashlib.sha256(raw).hexdigest(),'source_bytes':len(raw),'compiled':True,'checks':checks},indent=2)+'\n')
          PY
            RC=$?
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release_payload/ARENA_V2_VALIDATION_LOG.txt release_payload/ARENA_V2_VALIDATION.json
          git commit -m "Record Arena V2 diagnostic 2 [skip ci]" || true
          git push origin HEAD:arena-v2 || true
          exit "$RC"
