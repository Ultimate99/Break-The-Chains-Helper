name: Diagnose V7.3 Structure

on:
  push:
    branches: [arena-v2]
    paths: [".github/workflows/v73_structural_diag.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena-v2
      - name: Build and record every check
        shell: bash
        env:
          TG_SKIP_MANIFEST_PUBLISH: "1"
        run: |
          set -euo pipefail
          python release_payload/build_release_v730.py --repo-root . --version 7.3.0 --output /tmp/v73.py
          python -m py_compile /tmp/v73.py
          python - <<'PY'
          import ast, copy, hashlib, json
          from pathlib import Path
          p=Path('/tmp/v73.py'); text=p.read_text(encoding='utf-8'); tree=ast.parse(text)
          checks={
            'app_version': text.count('APP_VERSION = "7.3.0"') == 1,
            'phase1_learning': text.count('V7.3 Arena V2 Phase 1 — adaptive battle learning build marker') == 1,
            'pilot_marker': text.count('V7.3 Arena V2 Pilot — calibrated-action reinforcement controller build marker') == 1,
            'pilot_12_match_gate': '"pilot_min_trained_matches": 12' in text,
            'pilot_4w4l_gate': '"pilot_min_wins": 4' in text and '"pilot_min_losses": 4' in text,
            'pilot_2_action_gate': '"pilot_min_actions": 2' in text,
            'pilot_no_effect_fallback': '"pilot_no_effect_fallback": 3' in text,
            'pilot_action_cap': '"pilot_max_actions_per_match": 50' in text,
            'calibrated_points_only': 'def _arena_pilot_valid_points():' in text,
            'pilot_disables_auto': 'ARENA PILOT: disabled game AUTO' in text,
            'pilot_outcome_learning': 'self._pilot_finish(' in text and 'outcome=result' in text,
            'pilot_visual_reward': 'reward += 0.025 if visual_changed else -0.035' in text,
            'adaptive_quit_preserved': text.count('arena_adaptive_quit_ready()') >= 2,
            'home_hotfix_preserved': text.count('V7.2.1: HOME is the only screen allowed a bounded soft match.') == 1,
            'route_hotfix_preserved': text.count('V7.2.2: the first changed frame is often only a transition.') == 1,
            'auto_bootstrap_preserved': text.count('self._learning_note_action("ENABLE_AUTO", "bootstrap")') == 1,
            'daily_marker': text.count('V7.3 Daily Self-Healing Vision — OCR-verified adaptive fingerprints + bounded recovery build marker') == 1,
            'daily_adaptive_file': text.count('VISION_ADAPTIVE_FILE = PROFILE_DIR / "vision_adaptive.json"') == 1,
            'daily_adaptive_learning': 'def _vision_learn_screen(self, name, ref, evidence="OCR"):' in text,
            'daily_ocr_fallback': 'def _daily_ocr_recognize_screen(self, ref):' in text,
            'daily_unknown_only_override': 'if screen == "UNKNOWN" and name in {"MAIL", "SHOP", "QUEST", "EVENT", "RECRUIT", "REGULAR_RECRUIT", "CHAIN"}:' in text,
            'daily_bounded_recovery': 'recovery_origin = None' in text and 'expected,timeout=3.20,initial_ref=retry_ref' in text,
            'daily_failure_evidence': 'def _daily_save_failure_frame(self, module, stage, ref, detail=""):' in text,
            'daily_no_unknown_nav': 'No unverified navigation was attempted.' in text and 'Daily will not navigate from an unknown screen.' in text,
            'daily_no_android_back': 'KEYCODE_BACK' not in text and 'keyevent 4' not in text,
            'safe_action_literals': all(token in text for token in ['"CLAIM ALL"','"CLAIM"','"FREE"']),
            'idle_verified_fallback_preserved': 'idle_ok,idle_detail=self._daily_anchor_check("IDLE_POPUP",ref)' in text,
          }
          methods={n.name for n in ast.walk(tree) if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))}
          checks['required_methods']={'_pilot_reset','_pilot_ready','_pilot_choose_action','_pilot_update_pending','_pilot_step','_pilot_finish','_validate_pilot_health','_vision_adaptive_state','_vision_learn_screen','_daily_ocr_recognize_screen','_daily_save_failure_frame'}.issubset(methods)
          try:
            adaptive=text.index('adaptive_loss = self._learning_sample(ref, auto_state)')
            pilot=text.index('if self._pilot_step(',adaptive)
            auto=text.index('if auto_state == "OFF":',pilot)
            dodge=text.rfind('if self.dodge_in_progress:',adaptive,pilot)
            checks['arena_priority_order']=adaptive < dodge < pilot < auto
          except Exception:
            checks['arena_priority_order']=False
          pilot_patch=Path('release_payload/arena_v2_pilot_patch.py').read_text(encoding='utf-8')
          checks['readable_pilot_patch']='gzip.decompress' not in pilot_patch and 'base64.b64decode' not in pilot_patch
          checks['readable_daily_patch']='gzip.decompress' not in Path('release_payload/daily_v73_patch.py').read_text(encoding='utf-8')
          helper_checks={}
          try:
            wanted={'_arena_time_bucket','_arena_pilot_context','_arena_pilot_node','_arena_pilot_score','_daily_screen_token_rules'}
            selected=[]
            for n in ast.walk(tree):
              if isinstance(n,ast.FunctionDef) and n.name in wanted:
                c=copy.deepcopy(n); c.decorator_list=[]; selected.append(c)
            ns={'normalize_daily_word': lambda value:' '.join(''.join(ch if (ch.isalpha() or ch==' ') else ' ' for ch in str(value or '').upper()).split())}
            exec(compile(ast.Module(body=selected,type_ignores=[]),'<helpers>','exec'),ns,ns)
            helper_checks={
              'time_bucket': ns['_arena_time_bucket'](15.1)=='2',
              'pilot_context': '|CRIT|REAL|' in ns['_arena_pilot_context'](10,0.91,'REAL',['A','B']),
              'mail_rule': ns['_daily_screen_token_rules']('MAIL')=='MAIL',
              'shop_conflict': ns['_daily_screen_token_rules']('SHOP EVENT PACK')=='SHOP',
              'chain_rule': ns['_daily_screen_token_rules']('CHAIN CAMPAIGN')=='CHAIN',
              'home_not_ocr': ns['_daily_screen_token_rules']('HOME COMBAT PVP') is None,
              'idle_not_ocr': ns['_daily_screen_token_rules']('IDLE REWARDS') is None,
            }
          except Exception as exc:
            helper_checks={'exception':False,'detail':str(exc)}
          passed=all(checks.values()) and all(v for k,v in helper_checks.items() if k!='detail')
          receipt={'version':'7.3.0-dev-diagnostic','passed':passed,'source_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'source_bytes':p.stat().st_size,'checks':checks,'helper_checks':helper_checks}
          Path('release_payload/V73_DIAGNOSTIC.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release_payload/V73_DIAGNOSTIC.json
          git commit -m "Record V7.3 structural diagnostics [skip ci]"
          git push origin HEAD:arena-v2
