name: Repair updater manifest

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/manifest_repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build current source and publish fallback manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist/repair
          python release_payload/build_release.py \
            --repo-root . \
            --version "$VERSION" \
            --output dist/repair/tg_arena_bot.py
          python -m py_compile dist/repair/tg_arena_bot.py
          grep -F "APP_VERSION = \"${VERSION}\"" dist/repair/tg_arena_bot.py
