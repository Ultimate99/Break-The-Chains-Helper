name: Validate Arena V2 Pilot

on:
  push:
    branches:
      - arena-v2
    paths:
      - ".github/workflows/arena_v2_validate.yml"
      - "release_payload/build_release_v730.py"
      - "release_payload/arena_v2_patch.py"
      - "release_payload/arena_v2_patch_payload.txt"
      - "release_payload/arena_v2_pilot_patch.py"
      - "release_payload/daily_v73_patch.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena-v2

      - name: Build exact v7.3.0 source
        shell: bash
        env:
          TG_SKIP_MANIFEST_PUBLISH: "1"
        run: |
          set -euo pipefail
          python release_payload/build_release_v730.py \
            --repo-root . \
            --version 7.3.0 \
            --output /tmp/tg_arena_bot_v7_3_0.py \
            2>&1 | tee /tmp/arena_v2_validation.log
          python -m py_compile /tmp/tg_arena_bot_v7_3_0.py

      - name: Structural and safety assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, hashlib, json
          from pathlib import Path

          p = Path('/tmp/tg_arena_bot_v7_3_0.py')
          text = p.read_text(encoding='utf-8')
          tree = ast.parse(text)

          checks = {
              'app_version': text.count('APP_VERSION = "7.3.0"') == 1,
              'phase1_learning': text.count('V7.3 Arena V2 Phase 1 — adaptive battle learning build marker') == 1,
              'pilot_marker': text.count('V7.3 Arena V2 Pilot — calibrated-action reinforcement controller build marker') == 1,
              'pilot_12_match_gate': '"pilot_min_trained_matches": 12' in text,
              'pilot_4w4l_gate': '"pilot_min_wins": 4' in text and '"pilot_min_losses": 4' in text,
              'pilot_2_action_gate': '"pilot_min_actions": 2' in text,
              'pilot_no_effect_fallback': '"pilot_no_effect_fallback": 3' in text,
              'pilot_action_cap': '"pilot_max_actions_per_match": 50' in text,
              'calibrated_points_only': 'def _arena_pilot_valid_points():' in text and 'strategy_settings()' in text,
              'pilot_disables_auto': 'ARENA PILOT: disabled game AUTO' in text,
              'pilot_outcome_learning': 'self._pilot_finish(' in text and 'outcome=result' in text,
              'pilot_visual_reward': 'reward += 0.025 if visual_changed else -0.035' in text,
              'adaptive_quit_preserved': text.count('arena_adaptive_quit_ready()') >= 2,
              'home_hotfix_preserved': text.count('V7.2.1: HOME is the only screen allowed a bounded soft match.') == 1,
              'route_hotfix_preserved': text.count('V7.2.2: the first changed frame is often only a transition.') == 1,
              'auto_bootstrap_preserved': text.count('self._learning_note_action("ENABLE_AUTO", "bootstrap")') == 1,
              'persistent_trace': text.count('arena_battle_trace.jsonl') == 1,
              'persistent_model': text.count('arena_learning_model.json') == 1,
          }

          method_names = {
              node.name for node in ast.walk(tree)
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          required_methods = {
              '_pilot_reset', '_pilot_ready', '_pilot_choose_action',
              '_pilot_update_pending', '_pilot_step', '_pilot_finish',
              '_validate_pilot_health',
          }
          checks['pilot_methods'] = required_methods.issubset(method_names)

          adaptive_pos = text.index('adaptive_loss = self._learning_sample(ref, auto_state)')
          pilot_pos = text.index('if self._pilot_step(', adaptive_pos)
          auto_pos = text.index('if auto_state == "OFF":', pilot_pos)
          dodge_pos = text.rfind('if self.dodge_in_progress:', adaptive_pos, pilot_pos)
          checks['priority_order'] = adaptive_pos < dodge_pos < pilot_pos < auto_pos

          # No legacy opaque Pilot loader is allowed in the production patch.
          pilot_patch = Path('release_payload/arena_v2_pilot_patch.py').read_text(encoding='utf-8')
          checks['readable_pilot_patch'] = (
              'gzip.decompress' not in pilot_patch
              and 'base64.b64decode' not in pilot_patch
              and 'def apply_arena_v2_pilot_patch' in pilot_patch
          )

          if not all(checks.values()):
              raise SystemExit('Arena V2 structural validation failed: ' + json.dumps(checks, indent=2))

          # Pure-helper smoke tests without launching Tk/ADB.
          selected = []
          wanted = {'_arena_time_bucket', '_arena_pilot_context', '_arena_pilot_node', '_arena_pilot_score'}
          for node in tree.body:
              if isinstance(node, ast.FunctionDef) and node.name in wanted:
                  selected.append(node)
          ns = {}
          exec(compile(ast.Module(body=selected, type_ignores=[]), '<pilot_helpers>', 'exec'), ns, ns)
          assert ns['_arena_time_bucket'](0) == '0'
          assert ns['_arena_time_bucket'](15.1) == '2'
          assert '|CRIT|REAL|' in ns['_arena_pilot_context'](10, 0.91, 'REAL', ['A', 'B'])
          assert '|LOW|BOT|' in ns['_arena_pilot_context'](10, 0.12, 'BOT', [])
          store = {}
          node = ns['_arena_pilot_node'](store, 'Skill A')
          assert node['tries'] == 0 and 'Skill A' in store
          assert ns['_arena_pilot_score'](node) > 0

          raw = p.read_bytes()
          receipt = {
              'version': '7.3.0-dev-pilot',
              'source_sha256': hashlib.sha256(raw).hexdigest(),
              'source_bytes': len(raw),
              'compiled': True,
              'checks': checks,
          }
          Path('release_payload/ARENA_V2_VALIDATION.json').write_text(
              json.dumps(receipt, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Persist validation receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/arena_v2_validation.log release_payload/ARENA_V2_VALIDATION_LOG.txt
          git add release_payload/ARENA_V2_VALIDATION.json release_payload/ARENA_V2_VALIDATION_LOG.txt
          git commit -m "Record Arena V2 quality validation [skip ci]" || true
          git push origin HEAD:arena-v2
