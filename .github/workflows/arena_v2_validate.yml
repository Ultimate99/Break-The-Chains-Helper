name: Validate V7.3 Quality Gate

on:
  push:
    branches:
      - arena-v2
    paths:
      - ".github/workflows/arena_v2_validate.yml"
      - "release_payload/build_release_v730.py"
      - "release_payload/arena_v2_patch.py"
      - "release_payload/arena_v2_patch_payload.txt"
      - "release_payload/arena_v2_pilot_patch.py"
      - "release_payload/arena_v2_perception_core.py"
      - "release_payload/arena_v2_perception_integration.py"
      - "release_payload/arena_v2_perception_events.py"
      - "release_payload/arena_v2_perception_ui.py"
      - "release_payload/daily_v73_patch.py"
      - "release_payload/daily_v73_core.py"
      - "release_payload/daily_v73_identify.py"
      - "release_payload/daily_v73_anchor.py"
      - "release_payload/daily_v73_start.py"
      - "release_payload/daily_v73_route.py"
      - "release_payload/daily_v73_finish.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena-v2

      - name: Build exact v7.3.0 source
        id: build
        shell: bash
        env:
          TG_SKIP_MANIFEST_PUBLISH: "1"
        run: |
          set +e
          python release_payload/build_release_v730.py \
            --repo-root . \
            --version 7.3.0 \
            --output /tmp/tg_arena_bot_v7_3_0.py \
            > /tmp/v73_validation.log 2>&1
          RC=$?
          if [ "$RC" -eq 0 ]; then
            python -m py_compile /tmp/tg_arena_bot_v7_3_0.py >> /tmp/v73_validation.log 2>&1
            RC=$?
          fi
          cat /tmp/v73_validation.log
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Structural, safety and helper assertions
        if: steps.build.outputs.rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast, copy, hashlib, json
          from pathlib import Path

          p = Path('/tmp/tg_arena_bot_v7_3_0.py')
          text = p.read_text(encoding='utf-8')
          tree = ast.parse(text)

          checks = {
              'app_version': text.count('APP_VERSION = "7.3.0"') == 1,
              'phase1_learning': text.count('V7.3 Arena V2 Phase 1 — adaptive battle learning build marker') == 1,
              'pilot_marker': text.count('V7.3 Arena V2 Pilot — calibrated-action reinforcement controller build marker') == 1,
              'pilot_12_match_gate': '"pilot_min_trained_matches": 12' in text,
              'pilot_4w4l_gate': '"pilot_min_wins": 4' in text and '"pilot_min_losses": 4' in text,
              'pilot_2_action_gate': '"pilot_min_actions": 2' in text,
              'pilot_no_effect_fallback': '"pilot_no_effect_fallback": 3' in text,
              'pilot_action_cap': '"pilot_max_actions_per_match": 50' in text,
              'calibrated_points_only': 'def _arena_pilot_valid_points():' in text and 'strategy_settings()' in text,
              'pilot_disables_auto': 'ARENA PILOT: disabled game AUTO' in text,
              'pilot_outcome_learning': 'self._pilot_finish(' in text and 'outcome=result' in text,
              'pilot_visual_reward': 'reward += 0.025 if visual_changed else -0.035' in text,
              'adaptive_quit_preserved': text.count('arena_adaptive_quit_ready()') >= 2,
              'home_hotfix_preserved': text.count('V7.2.1: HOME is the only screen allowed a bounded soft match.') == 1,
              'route_hotfix_preserved': text.count('V7.2.2: the first changed frame is often only a transition.') == 1,
              'auto_bootstrap_preserved': text.count('self._learning_note_action("ENABLE_AUTO", "bootstrap")') == 1,
              'persistent_trace': text.count('arena_battle_trace.jsonl') == 1,
              'persistent_model': text.count('arena_learning_model.json') == 1,

              'daily_marker': text.count('V7.3 Daily Self-Healing Vision — OCR-verified adaptive fingerprints + bounded recovery build marker') == 1,
              'daily_adaptive_file': text.count('VISION_ADAPTIVE_FILE = PROFILE_DIR / "vision_adaptive.json"') == 1,
              'daily_adaptive_learning': 'def _vision_learn_screen(self, name, ref, evidence="OCR"):' in text,
              'daily_ocr_fallback': 'def _daily_ocr_recognize_screen(self, ref):' in text,
              'daily_unknown_only_override': 'if screen == "UNKNOWN" and name in {"MAIL", "SHOP", "QUEST", "EVENT", "RECRUIT", "REGULAR_RECRUIT", "CHAIN"}:' in text,
              'daily_bounded_recovery': 'recovery_origin = None' in text and 'expected,timeout=3.20,initial_ref=retry_ref' in text,
              'daily_failure_evidence': 'def _daily_save_failure_frame(self, module, stage, ref, detail=""):' in text,
              'daily_no_unknown_nav': 'No unverified navigation was attempted.' in text and 'Daily will not navigate from an unknown screen.' in text,
              'daily_no_android_back': 'KEYCODE_BACK' not in text and 'keyevent 4' not in text,
              'safe_action_literals': all(token in text for token in ['"CLAIM ALL"', '"CLAIM"', '"FREE"']),
              'idle_verified_fallback_preserved': 'idle_ok,idle_detail=self._daily_anchor_check("IDLE_POPUP",ref)' in text,

              'perception_marker': text.count('V7.3 Arena Structured Perception — calibrated Power + HP features build marker') == 1,
              'perception_integration_marker': text.count('V7.3 Arena Perception Integration — Power persisted in intel/history/trace build marker') == 1,
              'power_calibration_only': '"power_roi": None' in text and 'def opponent_power_roi():' in text,
              'power_ocr_plausibility': '100 <= value <= 999_999_999' in text,
              'power_persisted': '"opponent_power": opponent_power' in text and 'session["current_opponent_power"] = intel.get("power")' in text,
              'hp_calibration_only': '"ally_hp_rois": []' in text and '"enemy_hp_rois": []' in text,
              'hp_structured_vector': 'structured = np.array(_arena_structured_battle_features(ref_screen), dtype=np.float32)' in text,
              'catastrophic_requires_learned_risk': 'if learned_probability is None or float(learned_probability) < 0.88:' in text,
              'catastrophic_requires_full_hp': 'if len(ally) < 3 or len(enemy) < 3:' in text,
              'catastrophic_thresholds': 'ally_avg <= 0.14' in text and 'enemy_avg >= 0.50' in text,
              'catastrophic_still_confirmed': 'probability = max(float(probability), 0.975)' in text and 'confirm_needed = max(1, int(settings.get("confirm_samples") or 2))' in text,
          }

          method_names = {
              node.name for node in ast.walk(tree)
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }
          required_methods = {
              '_pilot_reset', '_pilot_ready', '_pilot_choose_action',
              '_pilot_update_pending', '_pilot_step', '_pilot_finish',
              '_validate_pilot_health', '_vision_adaptive_state',
              '_vision_learn_screen', '_daily_ocr_recognize_screen',
              '_daily_save_failure_frame', 'read_opponent_power',
              '_arena_bar_fill_ratio', '_arena_hp_snapshot',
              '_arena_structured_battle_features', '_arena_catastrophic_state',
          }
          checks['required_methods'] = required_methods.issubset(method_names)

          adaptive_pos = text.index('adaptive_loss = self._learning_sample(ref, auto_state)')
          pilot_pos = text.index('if self._pilot_step(', adaptive_pos)
          auto_pos = text.index('if auto_state == "OFF":', pilot_pos)
          dodge_pos = text.rfind('if self.dodge_in_progress:', adaptive_pos, pilot_pos)
          checks['arena_priority_order'] = adaptive_pos < dodge_pos < pilot_pos < auto_pos

          pilot_patch = Path('release_payload/arena_v2_pilot_patch.py').read_text(encoding='utf-8')
          checks['readable_pilot_patch'] = (
              'gzip.decompress' not in pilot_patch
              and 'base64.b64decode' not in pilot_patch
              and 'def apply_arena_v2_pilot_patch' in pilot_patch
          )
          daily_wrapper = Path('release_payload/daily_v73_patch.py').read_text(encoding='utf-8')
          checks['readable_daily_patch'] = 'gzip.decompress' not in daily_wrapper and 'apply_daily_v73_patch' in daily_wrapper
          perception_patch = Path('release_payload/arena_v2_perception_core.py').read_text(encoding='utf-8')
          checks['readable_perception_patch'] = 'gzip.decompress' not in perception_patch and 'apply_arena_perception_core_patch' in perception_patch

          if not all(checks.values()):
              raise SystemExit('V7.3 structural validation failed: ' + json.dumps(checks, indent=2))

          # Pure helper smoke tests: no Tk, ADB or game process required.
          wanted = {
              '_arena_time_bucket', '_arena_pilot_context',
              '_arena_pilot_node', '_arena_pilot_score',
              '_daily_screen_token_rules', 'extract_power_value',
          }
          selected = []
          for node in ast.walk(tree):
              if isinstance(node, ast.FunctionDef) and node.name in wanted:
                  clone = copy.deepcopy(node)
                  clone.decorator_list = []
                  selected.append(clone)
          ns = {
              're': __import__('re'),
              'normalize_daily_word': lambda value: ' '.join(
                  ''.join(ch if (ch.isalpha() or ch == ' ') else ' ' for ch in str(value or '').upper()).split()
              )
          }
          exec(compile(ast.Module(body=selected, type_ignores=[]), '<v73_helpers>', 'exec'), ns, ns)
          assert ns['_arena_time_bucket'](0) == '0'
          assert ns['_arena_time_bucket'](15.1) == '2'
          assert '|CRIT|REAL|' in ns['_arena_pilot_context'](10, 0.91, 'REAL', ['A', 'B'])
          store = {}
          node = ns['_arena_pilot_node'](store, 'Skill A')
          assert node['tries'] == 0 and ns['_arena_pilot_score'](node) > 0
          screen_rule = ns['_daily_screen_token_rules']
          assert screen_rule('MAIL') == 'MAIL'
          assert screen_rule('SHOP EVENT PACK') == 'SHOP'
          assert screen_rule('CHAIN CAMPAIGN') == 'CHAIN'
          assert screen_rule('QUEST PASS') == 'QUEST'
          assert screen_rule('RECRUIT') == 'RECRUIT'
          assert screen_rule('EVENT') == 'EVENT'
          assert screen_rule('HOME COMBAT PVP') is None
          assert screen_rule('IDLE REWARDS') is None
          power = ns['extract_power_value']
          assert power('Power 123,456') == 123456
          assert power('CP: 98 765') == 98765
          assert power('abc') is None
          assert power('12') is None

          raw = p.read_bytes()
          receipt = {
              'version': '7.3.0-dev-quality',
              'source_sha256': hashlib.sha256(raw).hexdigest(),
              'source_bytes': len(raw),
              'compiled': True,
              'checks': checks,
          }
          Path('release_payload/ARENA_V2_VALIDATION.json').write_text(
              json.dumps(receipt, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Persist validation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp /tmp/v73_validation.log release_payload/ARENA_V2_VALIDATION_LOG.txt || true
          git add release_payload/ARENA_V2_VALIDATION_LOG.txt
          if [ -f release_payload/ARENA_V2_VALIDATION.json ]; then
            git add release_payload/ARENA_V2_VALIDATION.json
          fi
          git commit -m "Record V7.3 quality validation evidence [skip ci]" || true
          git push origin HEAD:arena-v2 || true

      - name: Enforce build success
        if: always()
        shell: bash
        run: |
          test "${{ steps.build.outputs.rc }}" = "0"
