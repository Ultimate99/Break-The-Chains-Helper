name: Arena V2 Pilot Gate

on:
  push:
    branches:
      - arena-v2
    paths:
      - ".github/workflows/arena_v2_pilot_gate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena-v2
      - name: Build compile and verify Pilot
        shell: bash
        env:
          TG_SKIP_MANIFEST_PUBLISH: "1"
        run: |
          set -euo pipefail
          python release_payload/build_release_v730.py --repo-root . --version 7.3.0 --output /tmp/v730.py 2>&1 | tee /tmp/v730.log
          python -m py_compile /tmp/v730.py
          python - <<'PY'
          import ast, hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('/tmp/v730.py')
          text=p.read_text(encoding='utf-8')
          ast.parse(text)
          pilot=text.index('if self._pilot_step(ref, adaptive_loss, actual_w, actual_h):')
          auto=text.index('if auto_state == "OFF":', pilot)
          dodge=text.rfind('if self.dodge_in_progress:', 0, pilot)
          checks={
            'app_version': text.count('APP_VERSION = "7.3.0"') == 1,
            'adaptive_learner': 'adaptive_loss = self._learning_sample(ref, auto_state)' in text,
            'adaptive_quit': text.count('arena_adaptive_quit_ready()') >= 2,
            'pilot_marker': text.count('V7.3 Arena V2 Pilot — calibrated-action reinforcement controller build marker') == 1,
            'pilot_ready_gate': '"min_trained_matches": 6' in text and '"min_actions": 2' in text,
            'calibrated_only': text.count('for name, point in (strat.get("action_points") or {}).items()') >= 2,
            'pilot_preempts_auto': 0 <= dodge < pilot < auto,
            'action_reward': 'reward += 0.025 if visual_changed else -0.035' in text,
            'action_trace': 'self._learning_note_action(action, "pilot")' in text,
            'outcome_feedback': 'self._pilot_finish("WIN" if is_win else "LOSS")' in text,
            'home_fix': 'V7.2.1: HOME is the only screen allowed a bounded soft match.' in text,
            'route_fix': 'V7.2.2: the first changed frame is often only a transition.' in text,
            'auto_bootstrap': 'self._learning_note_action("ENABLE_AUTO", "bootstrap")' in text,
          }
          if not all(checks.values()):
              raise SystemExit(f'Pilot gate failed: {checks}')
          raw=p.read_bytes()
          receipt={
            'version':'7.3.0-dev-pilot',
            'source_sha256':hashlib.sha256(raw).hexdigest(),
            'source_bytes':len(raw),
            'compiled':True,
            'checks':checks,
            'validated_at':datetime.now(timezone.utc).isoformat(),
          }
          Path('release_payload/ARENA_V2_VALIDATION.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          PY
          cp /tmp/v730.log release_payload/ARENA_V2_VALIDATION_LOG.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release_payload/ARENA_V2_VALIDATION.json release_payload/ARENA_V2_VALIDATION_LOG.txt
          git commit -m "Arena V2 Pilot gate passed [skip ci]"
          git push origin HEAD:arena-v2
