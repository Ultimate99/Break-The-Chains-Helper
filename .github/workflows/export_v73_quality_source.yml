name: Export Exact V7.3 Quality Source
# final production export generation 7

on:
  push:
    branches: [arena-v2]
    paths: [".github/workflows/export_v73_quality_source.yml"]

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena-v2
      - name: Build, compile and export exact validated source
        env:
          TG_SKIP_MANIFEST_PUBLISH: "1"
        run: |
          set -euo pipefail
          python release_payload/build_release_v730.py --repo-root . --version 7.3.0 --output /tmp/v73.py
          python -m py_compile /tmp/v73.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path('/tmp/v73.py')
          raw=p.read_bytes()
          expected='c5b6441ba8f19f2e1b22813a3dddc1752c545639e8a29aecab0f8a8f4de5331a'
          got=hashlib.sha256(raw).hexdigest()
          if got != expected or len(raw) != 447547:
              raise SystemExit(f'Final V7.3 source mismatch: {got} / {len(raw)}')
          PY
          cp /tmp/v73.py release_payload/debug_v730_quality_source.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release_payload/debug_v730_quality_source.py
          git commit -m "Export exact final V7.3 production source [skip ci]"
          git push origin HEAD:arena-v2
