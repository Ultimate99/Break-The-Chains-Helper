name: Validate V7.2.2 route settle hotfix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/debug_v721_source.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate V7.2.2
        shell: bash
        env:
          TG_SKIP_MANIFEST_PUBLISH: "1"
        run: |
          set -euo pipefail
          python release_payload/build_release.py --repo-root . --version "7.2.2" --output /tmp/tg_arena_bot_v7_2_2.py
          python -m py_compile /tmp/tg_arena_bot_v7_2_2.py
          grep -F 'APP_VERSION = "7.2.2"' /tmp/tg_arena_bot_v7_2_2.py
          grep -F 'V7.2.1: HOME is the only screen allowed a bounded soft match.' /tmp/tg_arena_bot_v7_2_2.py
          grep -F 'V7.2.2: the first changed frame is often only a transition.' /tmp/tg_arena_bot_v7_2_2.py
          grep -F 'expected, timeout=2.40, initial_ref=last_after' /tmp/tg_arena_bot_v7_2_2.py
          python - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path('/tmp/tg_arena_bot_v7_2_2.py')
          text = p.read_text(encoding='utf-8')
          checks = {
              'app_version': text.count('APP_VERSION = "7.2.2"') == 1,
              'home_hotfix_preserved': text.count('V7.2.1: HOME is the only screen allowed a bounded soft match.') == 1,
              'route_hotfix_marker': text.count('V7.2.2: the first changed frame is often only a transition.') == 1,
              'route_settle_2_40': text.count('expected, timeout=2.40, initial_ref=last_after') == 1,
              'old_route_timeout_removed': 'expected,timeout=0.85,initial_ref=last_after' not in text,
              'mail_strict_threshold_preserved': '"MAIL": {"rois": [(55,0,320,90),(90,70,560,160)], "hashes": [0x8458A75F94D86557, 0x846E957B7B8161B1], "max_avg": 13.0}' in text,
          }
          if not all(checks.values()):
              raise SystemExit(f'V7.2.2 validation failed: {checks}')
          raw = p.read_bytes()
          receipt = {
              'version': '7.2.2',
              'source_sha256': hashlib.sha256(raw).hexdigest(),
              'source_bytes': len(raw),
              'compiled': True,
              'checks': checks,
              'validated_at': datetime.now(timezone.utc).isoformat(),
          }
          Path('release_payload/V722_VALIDATION.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release_payload/V722_VALIDATION.json
          git commit -m "Record V7.2.2 route hotfix validation [skip ci]"
          git push
