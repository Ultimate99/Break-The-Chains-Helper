name: Test V7.3 Algorithms

on:
  push:
    branches: [arena-v2]
    paths:
      - ".github/workflows/v73_algorithm_tests.yml"
      - "release_payload/test_v730_algorithms.py"
      - "release_payload/build_release_v730.py"
      - "release_payload/arena_v2_perception_core.py"
      - "release_payload/arena_v2_perception_adaptive.py"
      - "release_payload/arena_v2_perception_events.py"
      - "release_payload/arena_v2_pilot_patch.py"
      - "release_payload/daily_v73_identify.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TG_SKIP_MANIFEST_PUBLISH: "1"
      APPDATA: /tmp/tgbtc-v73-profile
      V73_SOURCE: /tmp/v73.py
      V73_ALGORITHM_RECEIPT: release_payload/V73_ALGORITHM_TESTS.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena-v2

      - name: Install vision test runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "numpy>=1.26,<3" \
            "opencv-python-headless>=4.8,<5" \
            "pytesseract>=0.3.10,<1"

      - name: Build exact source
        id: build
        shell: bash
        run: |
          set +e
          rm -f release_payload/V73_ALGORITHM_TESTS.json
          python release_payload/build_release_v730.py \
            --repo-root . --version 7.3.0 --output /tmp/v73.py \
            > /tmp/v73_algorithm.log 2>&1
          RC=$?
          if [ "$RC" -eq 0 ]; then
            python -m py_compile /tmp/v73.py >> /tmp/v73_algorithm.log 2>&1
            RC=$?
          fi
          cat /tmp/v73_algorithm.log
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run synthetic algorithm suite
        id: algorithms
        if: steps.build.outputs.rc == '0'
        shell: bash
        run: |
          set +e
          python release_payload/test_v730_algorithms.py \
            >> /tmp/v73_algorithm.log 2>&1
          RC=$?
          tail -n 160 /tmp/v73_algorithm.log
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist receipt and failure log
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/v73_algorithm.log release_payload/V73_ALGORITHM_TESTS.log || true
          if [ ! -f release_payload/V73_ALGORITHM_TESTS.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          Path('release_payload/V73_ALGORITHM_TESTS.json').write_text(
              json.dumps({
                  'version':'7.3.0-dev-algorithms',
                  'passed':False,
                  'build_rc':int('${{ steps.build.outputs.rc }}' or '999'),
                  'test_rc':int('${{ steps.algorithms.outputs.rc }}' or '999'),
                  'log':'V73_ALGORITHM_TESTS.log',
              }, indent=2) + '\n', encoding='utf-8'
          )
          PY
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release_payload/V73_ALGORITHM_TESTS.json release_payload/V73_ALGORITHM_TESTS.log
          git commit -m "Record V7.3 algorithm test evidence [skip ci]" || true
          git push origin HEAD:arena-v2 || true

      - name: Enforce algorithm success
        if: always()
        shell: bash
        run: |
          test "${{ steps.build.outputs.rc }}" = "0"
          test "${{ steps.algorithms.outputs.rc }}" = "0"
